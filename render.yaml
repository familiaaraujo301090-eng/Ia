services:
  - type: web
    name: rumo
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/rumo.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: PRO_CHECKOUT_URL
        sync: false
      - key: SMTP_URL
        sync: false
    disk:
      name: rumo-data
      mountPath: /var/data
      sizeGB: 1
